<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Grid Accent -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Monogram AH -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M16 46 L27 18 L32 30 L21 30" fill="none" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letter H connected -->
    <path d="M37 18 L37 46 M37 32 L49 32 M49 18 L49 46" fill="none" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Accent Node Dots -->
  <circle cx="27" cy="18" r="2.5" fill="#06b6d4" />
  <circle cx="49" cy="18" r="2.5" fill="#8b5cf6" />
  <circle cx="37" cy="46" r="2" fill="#3b82f6" />
</svg>